<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 -30 88 154"><style>*{transform-box:fill-box}.eStem{transform-origin:50% 0;animation:eStem 4.2s cubic-bezier(.7,0,.2,1) infinite}@keyframes eStem{0%{transform:scaleY(0);opacity:1}12%{transform:scaleY(1)}88%{opacity:1;transform:scaleY(1)}96%,100%{opacity:0;transform:scaleY(1)}}.eBowl{transform-origin:50% 0;animation:eBowl 4.2s cubic-bezier(.7,0,.2,1) infinite}@keyframes eBowl{0%,10%{transform:rotate(90deg);opacity:0}13%{opacity:1}30%{transform:rotate(0deg)}88%{opacity:1;transform:rotate(0deg)}96%,100%{opacity:0;transform:rotate(0deg)}}.eHead{transform-origin:center;animation:eHead 4.2s infinite}@keyframes eHead{0%,26%{transform:translateY(-44px);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,1)}28%{opacity:1}38%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.4,1)}43%{transform:translateY(-7px);animation-timing-function:cubic-bezier(.6,0,1,1)}48%{transform:translateY(0)}88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}.eTri{transform-origin:100% 100%;animation:eTri 4.2s infinite}@keyframes eTri{0%,46%{transform:scale(0);animation-timing-function:cubic-bezier(.3,0,.3,1)}56%{transform:scale(1.14);animation-timing-function:ease-in-out}61%{transform:scale(1)}88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="eStem" x="80" y="40" width="40" height="40.6" fill="#43659A"/><path class="eBowl" d="M40 80H120A40 40 0 0 1 40 80Z" fill="#43659A"/><circle class="eHead" cx="100" cy="20" r="16" fill="#D4764E"/><path class="eTri" d="M72 72V40L40 72Z" fill="#E2B44A"/></svg>
